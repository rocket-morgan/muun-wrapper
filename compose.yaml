services:
  muun-wrapper:
    build:
      context: .
      args:
        # Set by make build and scripts/up.sh from scripts/apollo-image.sh.
        APOLLO_IMAGE: ${APOLLO_IMAGE:-}
    env_file:
      - compose.secrets
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    ports:
      - "127.0.0.1:18080:8080"
    volumes:
      - ./data:/data
